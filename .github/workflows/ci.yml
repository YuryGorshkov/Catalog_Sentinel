name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: xmlreader, zip
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer qa
      - if: matrix.php == '8.4'
        run: composer audit --locked
      - if: matrix.php == '8.4'
        run: php tools/build-release.php
      - if: matrix.php == '8.4'
        run: php tools/validate-release.php
      - if: matrix.php == '8.4'
        run: composer test:performance
      - if: matrix.php == '8.4'
        uses: actions/upload-artifact@v7
        with:
          name: gorshkov.catalogsentinel-${{ github.sha }}
          path: build/gorshkov.catalogsentinel-*.zip
          if-no-files-found: error
